<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Red rounded rectangle frame -->
  <rect x="10" y="10" width="180" height="180" rx="14" ry="14"
        fill="none" stroke="#c62828" stroke-width="4"/>

  <!-- Reusable dark-navy gear shape (many teeth around a circle with center dot) -->
  <defs>
    <symbol id="gear" viewBox="-60 -60 120 120">
      <!-- Teeth: 14 rectangles rotated around the center -->
      <g fill="#1a2a5b">
        <g>
          <rect x="-6" y="-56" width="12" height="18" rx="2"/>
        </g>
        <g transform="rotate(25.7)"><rect x="-6" y="-56" width="12" height="18" rx="2"/></g>
        <g transform="rotate(51.4)"><rect x="-6" y="-56" width="12" height="18" rx="2"/></g>
        <g transform="rotate(77.1)"><rect x="-6" y="-56" width="12" height="18" rx="2"/></g>
        <g transform="rotate(102.8)"><rect x="-6" y="-56" width="12" height="18" rx="2"/></g>
        <g transform="rotate(128.5)"><rect x="-6" y="-56" width="12" height="18" rx="2"/></g>
        <g transform="rotate(154.2)"><rect x="-6" y="-56" width="12" height="18" rx="2"/></g>
        <g transform="rotate(180)"><rect x="-6" y="-56" width="12" height="18" rx="2"/></g>
        <g transform="rotate(205.7)"><rect x="-6" y="-56" width="12" height="18" rx="2"/></g>
        <g transform="rotate(231.4)"><rect x="-6" y="-56" width="12" height="18" rx="2"/></g>
        <g transform="rotate(257.1)"><rect x="-6" y="-56" width="12" height="18" rx="2"/></g>
        <g transform="rotate(282.8)"><rect x="-6" y="-56" width="12" height="18" rx="2"/></g>
        <g transform="rotate(308.5)"><rect x="-6" y="-56" width="12" height="18" rx="2"/></g>
        <g transform="rotate(334.2)"><rect x="-6" y="-56" width="12" height="18" rx="2"/></g>
      </g>
      <!-- Body ring -->
      <circle cx="0" cy="0" r="38" fill="none" stroke="#1a2a5b" stroke-width="6"/>
      <!-- Hub -->
      <circle cx="0" cy="0" r="8" fill="#1a2a5b"/>
    </symbol>
  </defs>

  <!-- One big gear on top -->
  <use href="#gear" x="60" y="30" width="80" height="80"/>
  <!-- Two smaller gears at bottom -->
  <use href="#gear" x="30" y="105" width="60" height="60"/>
  <use href="#gear" x="110" y="105" width="60" height="60"/>
</svg>
